name: "py-auth"

services:

  # These databases are used exclusively for the test suite.
  # Test data is created and cleaned up by pytest fixtures, so
  # persistent volumes are unnecessary.
  postgres:
    image: postgres:latest

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

  mysql:
    image: mysql:latest

    ports:
      - "${MYSQL_PORT:-3306}:3306"

    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}