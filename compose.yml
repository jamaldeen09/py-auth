name: "py-auth"

services:

  postgres:
    image: postgres:latest

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

  mysql:
    image: mysql:latest

    ports:
      - "${MYSQL_PORT:-3306}:3306"

    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}