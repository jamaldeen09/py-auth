[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py-auth-sqlalchemy"
version = "0.0.1"
authors = [
  { name = "Olatunji Jamaldeen", email = "jamaldeen.o@yahoo.com" },
]
description = "High-performance, async SQLAlchemy adapter for py-auth."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
license = { text = "MIT" }

dependencies = [
    "sqlalchemy>=2.0.0",
    "greenlet>=3.0.0",
    "py-auth>=0.0.1",
]

[project.urls]
"Homepage" = "https://github.com/jamaldeen09/py-auth"
"Repository" = "https://github.com/jamaldeen09/py-auth"

[tool.setuptools.packages.find]
where = ["src"]