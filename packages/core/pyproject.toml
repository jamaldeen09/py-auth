[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py-auth"
version = "0.0.1"
authors = [
  { name = "Olatunji Jamaldeen", email = "jamaldeen.o@yahoo.com" },
]
description = "Core auth primitives and provider framework for py-auth."
readme = "README.MD"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.28.0"]
mysql = ["aiomysql>=0.2.0"]
sqlite = ["aiosqlite>=0.19.0"]

[project.urls]
"Homepage" = "https://github.com/jamaldeen09/py-auth"
"Repository" = "https://github.com/jamaldeen09/py-auth"

[tool.setuptools.packages.find]
where = ["src"]
